<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel – Bravo</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="img/logo.jpg"><link rel="stylesheet" href="style.css">
<style>.wrap{max-width:900px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.o{background:#161616;border:1px solid #262626;border-radius:14px;padding:12px}
.o h3{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.st{color:#f5b400}.paid{color:#3c3}.pend{color:#e88}.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btns button{background:#222;color:#fff;border:1px solid #444;border-radius:20px;padding:8px 12px}.btns button.on{background:#f5b400;color:#000}.wa{display:inline-block;margin-top:8px;background:#25d366;color:#000;border-radius:12px;padding:10px 14px;font-weight:800;text-decoration:none}
#filters{display:flex;gap:6px;flex-wrap:wrap}section[hidden]{display:none}.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.kpi{background:#161616;border:1px solid #262626;border-radius:12px;padding:10px}.kpi small{color:#aaa;display:block}.kpi b{font-size:19px;color:#f5b400}.bd input{padding:6px;width:90px}.est{color:#aaa;font-size:12px}h4{color:#f5b400;margin:14px 0 4px}
.abar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#161616;border:1px solid #262626;border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px}
#newBanner{position:fixed;inset:0;z-index:50;background:#f5b400e6;display:flex;align-items:center;justify-content:center;animation:pulse 1s infinite}#newBanner[hidden]{display:none}
#newBanner div{background:#000;color:#fff;border-radius:18px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:16px;max-width:90%}#nbText{font-size:28px;color:#f5b400}
#nbAck{background:#25d366;color:#000;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:800}@keyframes pulse{50%{background:#ff3b30e6}}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff!important;color:#000!important;margin:0}}
.tk{font-family:"Courier New",monospace;color:#000;font-size:12px;line-height:1.35}.tk h1{text-align:center;font-size:22px;margin:0;letter-spacing:3px}.tk .c{text-align:center}.tk hr{border:0;border-top:1px dashed #000;margin:5px 0}
.tk table{width:100%;border-collapse:collapse}.tk td{vertical-align:top;padding:1px 0}.tk td.r{text-align:right;white-space:nowrap}.tk .big{font-size:16px;font-weight:bold}.tk .det{font-size:11px}.tk .st{font-size:15px;font-weight:bold;text-align:center;border:2px solid #000;padding:3px;margin:4px 0}
</style></head><body>
<header><img src="img/logo.jpg" alt="Bravo" class="logo"><b>Painel de pedidos</b></header>
<div class="wrap"><form id="login" class="view"><input type="password" id="pw" placeholder="Senha do painel" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><label class="r"><input type="checkbox" id="showPw"> Mostrar senha</label><p id="loginErr" style="color:#f66;font-weight:700;margin:0"></p><button class="go">Entrar</button></form>
<div id="panel" hidden><nav class="tabs" id="atabs"><button data-t="tPedidos" class="on">Pedidos</button><button data-t="tTaxas">Taxas de entrega</button><button data-t="tMet">Métricas</button><button data-t="tCli">Clientes</button></nav>
<section id="tPedidos"><div id="alertBar" class="abar"><button id="btnAlerts" class="go" style="padding:10px">🔔 Ativar alertas de pedido</button>
<label><input type="checkbox" id="optWake"> Manter tela ligada</label><label><input type="checkbox" id="optAutoPrint"> Imprimir automaticamente pedidos novos</label>
<label>Papel: <select id="optPaper"><option value="80">80 mm</option><option value="58">58 mm</option><option value="a4">A4</option></select></label><button id="btnTestAlert" class="ghost" style="padding:6px 10px">Testar som</button><small id="alertInfo" class="est"></small></div><div id="filters"><label><input type="checkbox" id="hideDone" checked> Ocultar entregues/cancelados</label> <button id="reload" class="ghost" style="padding:6px 12px">Atualizar</button> <span id="upd" style="color:#777"></span></div><div id="list"></div></section>
<section id="tTaxas" hidden><p class="cust">Bairros sem taxa aparecem para o cliente como "taxa a combinar". Para desativar um bairro, desmarque "Atende (desmarque para desativar)" — a taxa fica salva. Bairros não podem ser excluídos.</p>
<div class="row2"><input id="newB" placeholder="Novo bairro"><button id="addB" class="ghost" style="padding:8px 12px">Adicionar</button></div>
<table class="bd" id="tblB"></table><label class="cust">Taxa Mercado Pago no Pix (estimativa quando o MP não informa) %: <input id="mpPct" style="width:80px"></label>
<button id="saveB" class="go">Salvar taxas</button></section>
<section id="tMet" hidden><div class="row2" style="flex-wrap:wrap"><select id="per"><option value="hoje">Hoje</option><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="mes">Este mês</option><option value="custom">Personalizado</option></select>
<input type="date" id="dFrom" hidden><input type="date" id="dTo" hidden><button id="goMet" class="ghost" style="padding:8px 12px">Ver</button></div><div id="met"></div></section>
<section id="tCli" hidden><input id="qCli" placeholder="Buscar por nome, telefone ou bairro"><div id="cli"></div></section></div></div>
<script src="products.js"></script><script src="bairros.js"></script><script src="app-config.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pw=sessionStorage.getItem("bravoAdm")||"",orders=[],lastWa={};window.getOrders=()=>orders;
async function call(body){const r=await fetch(API+"/api/admin",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Password":pw},body:JSON.stringify(body)});const d=await r.json();if(r.status==401){sessionStorage.removeItem("bravoAdm");$("#panel").hidden=true;$("#login").hidden=false;throw new Error("Senha incorreta")}if(!r.ok)throw new Error("Erro ao carregar: "+(d.error||r.status));return d}
const phone=t=>{let d=String(t).replace(/\D/g,"");if(d.length<=11)d="55"+d;return d};
const msgs={"Aceito":"seu pedido foi aceito e já vai para a cozinha!","Em produção":"seu pedido está sendo preparado agora! 🔥","Saiu para entrega":"seu pedido saiu para entrega! 🛵","Pronto para retirada":"seu pedido está pronto para retirada! 🎉","Entregue":"pedido entregue. Obrigado e bom apetite! 😋","Cancelado":"infelizmente seu pedido foi cancelado. Fale com a gente se tiver dúvidas.","Recebido":"recebemos seu pedido!"};
function waLink(o){const txt=`Olá, ${o.cliente.nome}! Aqui é da Bravo 👑\nPedido nº ${o.id}: ${msgs[o.status]}\n\nResumo:\n`+orderText(o,"").split("\n\nNome:")[0]+`\n\nAcompanhe: ${SITE_URL}pedido.html?id=${o.id}`;return `https://wa.me/${phone(o.cliente.tel)}?text=${encodeURIComponent(txt)}`}
function render(){const hide=$("#hideDone").checked;$("#list").innerHTML=orders.filter(o=>!hide||!["Entregue","Cancelado"].includes(o.status)).map(o=>{const c=o.cliente,dt=new Date(o.criadoEm).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"});
return `<div class="o"><h3><span>nº ${esc(o.id)}</span><span class="st">${esc(o.status)}</span></h3><small>${dt}</small> · ${o.pagamento=="Pix"?(o.pago?'<b class="paid">PIX PAGO</b>':'<b class="pend">Pix pendente</b>'):esc(o.pagamento)}
<div class="cust"><b>${esc(c.nome)}</b> · <a style="color:#f5b400" href="tel:${esc(c.tel)}">${esc(c.tel)}</a><br>${c.tipo=="Retirada"?"Retirada no local":"Entrega: "+esc(c.end)}${c.obs?"<br>Obs.: "+esc(c.obs):""}</div>
<table class="bd">${o.itens.map(i=>`<tr><td>${i.qty}x ${esc(i.name)}${i.detalhe?` <small class="det">[${esc(i.detalhe)}]</small>`:""} <small>(${brlFmt(i.unit)})</small></td><td class="n">${brlFmt(i.subtotal)}</td></tr>`).join("")}<tr class="s"><td>Subtotal</td><td class="n">${brlFmt(o.subtotal)}</td></tr><tr class="s"><td>Taxa de entrega</td><td class="n">${feeLabel(o.taxaEntrega)}</td></tr><tr class="t"><td>Total</td><td class="n">${brlFmt(o.total)}${o.taxaEntrega==null?" + entrega":""}</td></tr></table>
<div class="btns">${ORDER_STATUSES.filter(s=>!(c.tipo=="Retirada"&&s=="Saiu para entrega")&&!(c.tipo!="Retirada"&&s=="Pronto para retirada")).map(s=>`<button data-id="${o.id}" data-s="${s}" class="${s==o.status?"on":""}">${s}</button>`).join("")}</div>
<button class="ghost" style="margin:8px 6px 0 0;padding:9px 12px" data-print="${o.id}">🖨️ Imprimir comanda</button><a class="wa" target="_blank" href="${waLink(o)}">${lastWa[o.id]?"📲 Avisar no WhatsApp: "+esc(o.status):"📲 Avisar cliente no WhatsApp"}</a></div>`}).join("")||"<p>Nenhum pedido.</p>"}
async function load(){try{const d=await call({action:"list"});orders=d.orders;render();if(window.onOrders)onOrders(orders);$("#upd").textContent="Atualizado "+new Date().toLocaleTimeString("pt-BR")}catch(e){alert(e.message)}}
$("#showPw").onchange=e=>$("#pw").type=e.target.checked?"text":"password";
$("#login").onsubmit=async e=>{e.preventDefault();pw=$("#pw").value.trim();$("#loginErr").textContent="Entrando…";try{await call({action:"list"});sessionStorage.setItem("bravoAdm",pw);$("#loginErr").textContent="";start()}catch(e){$("#loginErr").textContent=e.message=="Senha incorreta"?"Senha incorreta":(e.message.startsWith("Erro")?e.message:"Erro ao carregar: "+e.message)}};
function start(){$("#login").hidden=true;$("#panel").hidden=false;load();setInterval(load,10000);if(window.onStart)onStart()}
$("#list").onclick=async e=>{const b=e.target.closest("button[data-s]");if(!b)return;try{const o=await call({action:"setStatus",id:b.dataset.id,status:b.dataset.s});orders=orders.map(x=>x.id==o.id?o:x);lastWa[o.id]=1;render()}catch(e){alert(e.message)}};

/* ---- abas ---- */
$("#atabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll("#atabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));["tPedidos","tTaxas","tMet","tCli"].forEach(x=>$("#"+x).hidden=x!=t);({tTaxas:loadB,tMet:loadMet,tCli:loadCli}[t]||(()=>{}))()};
/* ---- taxas ---- */
let B=[];
async function loadB(){const s=await call({action:"getSettings"});B=s.bairros;$("#mpPct").value=String(s.mpPct).replace(".",",");drawB()}
function drawB(){$("#tblB").innerHTML="<tr><td><b>Bairro</b></td><td><b>Taxa R$</b></td><td><b>Atende</b><br><small class='est'>desmarque para desativar</small></td></tr>"+B.map((b,i)=>`<tr><td>${esc(b.nome)}</td><td><input data-i="${i}" data-f="taxa" inputmode="decimal" placeholder="a combinar" value="${b.taxa==null?"":String(b.taxa.toFixed(2)).replace(".",",")}"></td><td><input type="checkbox" data-i="${i}" data-f="ativo" ${b.ativo?"checked":""} style="width:22px;height:22px"></td></tr>`).join("")}
$("#tblB").oninput=$("#tblB").onchange=e=>{const i=e.target.dataset.i;if(i==null)return;if(e.target.dataset.f=="ativo")B[i].ativo=e.target.checked;else{const v=e.target.value.trim();B[i].taxa=v===""?null:v}};
$("#addB").onclick=()=>{const n=$("#newB").value.trim();if(n){B.unshift({nome:n,taxa:null,ativo:true});$("#newB").value="";drawB()}};
$("#saveB").onclick=async()=>{try{const s=await call({action:"saveSettings",bairros:B,mpPct:$("#mpPct").value});B=s.bairros;drawB();alert("Taxas salvas!")}catch(e){alert(e.message)}};
/* ---- métricas ---- */
$("#per").onchange=()=>{const c=$("#per").value=="custom";$("#dFrom").hidden=$("#dTo").hidden=!c;if(!c)loadMet()};$("#goMet").onclick=loadMet;
const spDay=d=>new Date(new Date(d).getTime()-3*3600e3).toISOString().slice(0,10); // dia em Brasília
function range(){const today=spDay(Date.now()),p=$("#per").value;let a,b=today;
if(p=="hoje")a=today;else if(p=="7"||p=="30")a=spDay(Date.now()-(Number(p)-1)*864e5);else if(p=="mes")a=today.slice(0,8)+"01";else{a=$("#dFrom").value||today;b=$("#dTo").value||today}
return{a,b,from:new Date(a+"T00:00:00-03:00").toISOString(),to:new Date(b+"T23:59:59.999-03:00").toISOString()}}
async function loadMet(){$("#met").textContent="Carregando…";try{const r=range(),d=await call({action:"metrics",from:r.from});
const os=d.orders.filter(o=>o.criadoEm>=r.from&&o.criadoEm<=r.to&&o.status!="Cancelado"),pct=d.settings.mpPct/100;
const days=Math.max(1,Math.round((new Date(r.b)-new Date(r.a))/864e5)+1);
let fat=0,taxas=0,itensQ=0,mpReal=0,mpEst=0;const prod={},opt={},pag={};
os.forEach(o=>{fat+=o.total;taxas+=o.taxaEntrega||0;const pk=o.pagamento+(o.pagamento=="Pix"?(o.pago?" (pago)":" (não pago)"):"");pag[pk]=pag[pk]||{n:0,v:0};pag[pk].n++;pag[pk].v+=o.total;
if(o.pagamento=="Pix"&&o.pago){if(typeof o.mpTaxa=="number")mpReal+=o.mpTaxa;else mpEst+=o.total*pct}
o.itens.forEach(i=>{itensQ+=i.qty;const k=i.name+(i.id=="a-copo"&&i.detalhe?" "+i.detalhe.split(" ")[0]:"");prod[k]=prod[k]||{q:0,v:0};prod[k].q+=i.qty;prod[k].v+=i.subtotal;
if(i.id=="a-copo"&&i.detalhe&&i.detalhe.includes(" + "))i.detalhe.split(" + ")[1].split(", ").forEach(x=>{opt[x]=(opt[x]||0)+i.qty})})});
const N=os.length,tbl=(rows,h)=>`<table class="bd"><tr>${h.map(x=>`<td><b>${x}</b></td>`).join("")}</tr>${rows.join("")}</table>`;
$("#met").innerHTML=`<p class="cust">${r.a.split("-").reverse().join("/")} a ${r.b.split("-").reverse().join("/")} · ${days} dia(s) · cancelados excluídos</p><div class="kpis">
<div class="kpi"><small>Faturamento</small><b>${brlFmt(fat)}</b></div><div class="kpi"><small>Pedidos</small><b>${N}</b></div><div class="kpi"><small>Ticket médio</small><b>${brlFmt(N?fat/N:0)}</b></div>
<div class="kpi"><small>Pedidos/dia</small><b>${(N/days).toFixed(1).replace(".",",")}</b></div><div class="kpi"><small>Produtos vendidos/dia</small><b>${(itensQ/days).toFixed(1).replace(".",",")}</b></div>
<div class="kpi"><small>Receita de taxas de entrega</small><b>${brlFmt(taxas)}</b></div><div class="kpi"><small>Taxa Mercado Pago (Pix)</small><b>${brlFmt(mpReal+mpEst)}</b>${mpEst?`<span class="est">inclui ${brlFmt(mpEst)} estimado (${String(d.settings.mpPct).replace(".",",")}%)</span>`:""}</div>
<div class="kpi"><small>Valor líquido</small><b>${brlFmt(fat-mpReal-mpEst)}</b></div></div>
<h4>Mais vendidos</h4>${tbl(Object.entries(prod).sort((a,b)=>b[1].q-a[1].q).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.q}</td><td class="n">${brlFmt(v.v)}</td></tr>`),["Produto","Qtd","Receita"])}
${Object.keys(opt).length?"<h4>Adicionais do açaí</h4>"+tbl(Object.entries(opt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`),["Adicional","Qtd"]):""}
<h4>Por forma de pagamento</h4>${tbl(Object.entries(pag).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${brlFmt(v.v)}</td></tr>`),["Forma","Pedidos","Valor"])}`}catch(e){$("#met").textContent=e.message}}
/* ---- clientes ---- */
let CL=[];async function loadCli(){$("#cli").textContent="Carregando…";try{CL=(await call({action:"customers"})).customers;drawCli()}catch(e){$("#cli").textContent=e.message}}
function drawCli(){const q=$("#qCli").value.toLowerCase().trim(),qd=q.replace(/\D/g,"");
const L=CL.filter(c=>!q||(c.nome||"").toLowerCase().includes(q)||(qd&&c.tel.includes(qd))||(c.endereco?.bairro||"").toLowerCase().includes(q));
$("#cli").innerHTML=`<p class="cust">${L.length} cliente(s)</p>`+L.map(c=>{const e=c.endereco;return `<div class="o"><h3><span>${esc(c.nome||"—")}</span><span class="st">${brlFmt(c.totalGasto)}</span></h3>
<div class="cust">📞 ${esc(c.telOriginal||c.tel)} · ${c.pedidos} pedido(s) · último: ${c.ultimoPedido?new Date(c.ultimoPedido).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}):"—"}${c.ultimoPedidoId?" (nº "+esc(c.ultimoPedidoId)+")":""}<br>
${e?`📍 ${esc(e.rua||"")}, ${esc(e.numero||"")}${e.complemento?" - "+esc(e.complemento):""} - ${esc(e.bairro||"")}${e.referencia?" (Ref.: "+esc(e.referencia)+")":""}`:"Retirada no local"}</div>
<a class="wa" target="_blank" href="https://wa.me/${phone(c.tel)}?text=${encodeURIComponent("Olá, "+(c.nome||"")+"! Aqui é da Bravo 👑")}">📲 WhatsApp</a></div>`}).join("")}
$("#qCli").oninput=drawCli;
$("#hideDone").onchange=render;$("#reload").onclick=load;if(pw)start();
</script><div id="newBanner" hidden><div><b id="nbText">NOVO PEDIDO!</b><button id="nbAck">OK, vi o pedido</button></div></div>
<div id="printArea"></div><style id="pageStyle"></style><script src="admin-extra.js"></script></body></html>
