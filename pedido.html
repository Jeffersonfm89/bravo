<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acompanhe seu pedido – Bravo</title><meta name="robots" content="noindex"><link rel="icon" href="img/logo.jpg"><link rel="stylesheet" href="style.css">
<style>.wrap{max-width:520px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.box{background:#161616;border:1px solid #262626;border-radius:14px;padding:14px}
.steps{list-style:none;padding:0;margin:0}.steps li{padding:8px 0 8px 30px;position:relative;color:#666}.steps li:before{content:"○";position:absolute;left:4px}
.steps li.done{color:#fff}.steps li.done:before{content:"●";color:#f5b400}.steps li.cur{color:#f5b400;font-weight:800}.big{font-size:22px;font-weight:800;color:#f5b400}.paid{color:#3c3;font-weight:800}</style></head><body>
<header><a href="./"><img src="img/logo.jpg" alt="Bravo" class="logo"></a></header>
<div class="wrap"><h2>Acompanhe seu pedido</h2><div id="out" class="box">Carregando…</div><small style="color:#777">Atualiza automaticamente a cada 10 segundos.</small><a class="ghost" href="./">Voltar à loja</a></div>
<script src="products.js"></script><script src="app-config.js"></script><script>
const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get("id")||"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){try{const r=await fetch(API+"/api/pedido?id="+encodeURIComponent(id)),o=await r.json();if(!r.ok)throw new Error(o.error);
const flow=o.status=="Cancelado"?["Recebido","Cancelado"]:["Recebido","Aceito","Em produção",o.cliente.tipo=="Retirada"?"Pronto para retirada":"Saiu para entrega","Entregue"];const k=flow.indexOf(o.status);
$("#out").innerHTML=`<p>Pedido nº <b>${esc(o.id)}</b></p><p class="big">${esc(o.status)}</p>${o.pago?'<p class="paid">✅ Pago via Pix</p>':(o.pagamento=="Pix"&&o.pix?'<p>Pagamento Pix pendente. <a href="#" id="cp" style="color:#f5b400">Copiar código Pix</a></p>':"")}
<ul class="steps">${flow.map((s,i)=>`<li class="${i<k?"done":i==k?"done cur":""}">${s}</li>`).join("")}</ul><hr style="border-color:#222">
<table class="bd">${o.itens.map(i=>`<tr><td>${i.qty}x ${esc(i.name)}${i.detalhe?`<br><small class="det">${esc(i.detalhe)}</small>`:""}<br><small>${brlFmt(i.unit)} cada</small></td><td class="n">${brlFmt(i.subtotal)}</td></tr>`).join("")}
<tr class="s"><td>Subtotal</td><td class="n">${brlFmt(o.subtotal)}</td></tr><tr class="s"><td>Taxa de entrega</td><td class="n">${feeLabel(o.taxaEntrega)}</td></tr><tr class="t"><td>Total</td><td class="n">${brlFmt(o.total)}${o.taxaEntrega==null?" + entrega":""}</td></tr></table>
<p class="cust">${o.cliente.tipo=="Retirada"?"Retirada no local":"Entrega: "+esc(o.cliente.end)}<br>Pagamento: ${esc(o.pagamento)}</p>`;
const cp=$("#cp");if(cp)cp.onclick=e=>{e.preventDefault();navigator.clipboard?.writeText(o.pix.qr_code);cp.textContent="Copiado!"};
if(["Entregue","Cancelado"].includes(o.status))clearInterval(t)}catch(e){$("#out").textContent=e.message||"Pedido não encontrado"}}
const t=setInterval(load,10000);load();
</script><script src="chat.js"></script></body></html>
